name: 1 - Import H-DO source

# Run this ONCE. It downloads the app source, applies the H-DO rebrand (name, package id,
# icon, links) and commits everything into this repository.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Import source and apply H-DO rebrand
        run: |
          set -e
          if [ -f app/build.gradle ]; then echo "Source already imported - nothing to do."; exit 0; fi
          git clone --depth 1 https://github.com/Hamddyy/ytdlnis.git /tmp/src
          cd /tmp/src
          git apply --binary "$GITHUB_WORKSPACE/H-DO-rebrand.patch"
          # point update/privacy/license links at THIS repository
          grep -rlI "Hamddyy/ytdlnis" . --include=*.kt --include=*.xml --include=*.md --include=*.gradle --exclude-dir=.git \
            | xargs -r sed -i "s#Hamddyy/ytdlnis#$GITHUB_REPOSITORY#g"
          rm -rf .git .github .idea .kotlin
          cd "$GITHUB_WORKSPACE"
          rm -f H-DO-rebrand.patch
          cp -a /tmp/src/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import H-DO source (rebranded)"
          git push
