name: Release signed APK

# Run from Actions -> "Release signed APK" -> Run workflow, and type the version (for example 1.5.6).
# It builds the arm64 and armeabi-v7a APKs, signs them with the key stored in GitHub secrets,
# and publishes them as a GitHub Release. The app's update check reads that release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag without v (must match versionName in app/build.gradle.kts)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore and check signing key
        env:
          S_B64: ${{ secrets.HDO_KEYSTORE_B64 }}
          S_STOREPASS: ${{ secrets.HDO_KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.HDO_KEY_ALIAS }}
          S_KEYPASS: ${{ secrets.HDO_KEY_PASSWORD }}
        run: |
          # Phone keyboards often add spaces, newlines or capital letters: strip whitespace everywhere.
          B64=$(printf %s "$S_B64" | tr -d '[:space:]')
          STOREPASS=$(printf %s "$S_STOREPASS" | tr -d '[:space:]')
          ALIAS=$(printf %s "$S_ALIAS" | tr -d '[:space:]')
          KEYPASS=$(printf %s "$S_KEYPASS" | tr -d '[:space:]')
          echo "secret lengths: b64=${#B64} (expect 3448) storepass=${#STOREPASS} (expect 7) alias=${#ALIAS} (expect 15) keypass=${#KEYPASS} (expect 7)"
          printf %s "$B64" | base64 -d > "$RUNNER_TEMP/hdo.keystore"
          echo "keystore md5: $(md5sum "$RUNNER_TEMP/hdo.keystore" | cut -d' ' -f1) (expect 58b4c8b6f472b941ab5081b5d9e88472)"
          echo "::group::keytool check"
          keytool -list -keystore "$RUNNER_TEMP/hdo.keystore" -storepass "$STOREPASS" 2>&1 | sed 's/^/  /' | grep -v "^  Your keystore" || true
          keytool -list -keystore "$RUNNER_TEMP/hdo.keystore" -storepass "$STOREPASS" -alias "$ALIAS" -keypass "$KEYPASS" 2>&1 | sed 's/^/  /' || true
          echo "::endgroup::"
          echo "HDO_KEYSTORE_FILE=$RUNNER_TEMP/hdo.keystore" >> "$GITHUB_ENV"
          echo "HDO_KEYSTORE_PASSWORD=$STOREPASS" >> "$GITHUB_ENV"
          echo "HDO_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "HDO_KEY_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"
      - name: Build signed release
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APKs
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *arm64*) cp "$f" "out/H-DO-arm64-v${{ inputs.version }}.apk" ;;
              *armeabi*) cp "$f" "out/H-DO-armeabi-v7a-v${{ inputs.version }}.apk" ;;
            esac
          done
          ls -l out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" out/*.apk --title "H-DO ${{ inputs.version }}" --generate-notes
      - name: Remove key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/hdo.keystore"
