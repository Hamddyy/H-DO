name: 2 - Build H-DO APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source was imported
        run: |
          if [ ! -f app/build.gradle ]; then echo "::error::Run workflow '1 - Import H-DO source' first."; exit 1; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Prepare
        run: |
          touch local.properties
          chmod +x gradlew

      - name: Build debug APK (no signing secrets needed)
        run: ./gradlew assembleGithubDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: H-DO-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to a GitHub Release (tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/github/debug/*.apk --title "H-DO $GITHUB_REF_NAME" --generate-notes
