<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H-DO</title>
<meta name="theme-color" content="#0B1F4B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#0d1b3d;--mut:#5b6a8c;--line:#dde4f2;--acc:#0a7fd1;--acc2:#00b8e6;--ok:#1a9e55;--bad:#d64545;--warn:#c98a00;--in:#eef2fa}
:root[data-theme=dark]{--bg:#071433;--card:#0f2250;--ink:#eaf1ff;--mut:#9db0d8;--line:#1e3569;--acc:#00c8ff;--acc2:#4ea3ff;--ok:#3ddc84;--bad:#ff6b6b;--warn:#ffc247;--in:#0a1a40}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header img{width:40px;height:40px;border-radius:10px}
header h1{font-size:22px;margin:0;flex:1;letter-spacing:.5px}
button,select,input,textarea{font:inherit;color:inherit}
.ib{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
textarea,input[type=text],input[type=number],input[type=password],select{width:100%;background:var(--in);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
textarea{resize:vertical;min-height:46px;direction:ltr;text-align:left}
textarea:focus,input:focus,select:focus{border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row .fit{flex:0 0 auto}
.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#04152e}
.btn.sec{background:var(--in);color:var(--ink);border:1px solid var(--line)}.btn.bad{background:var(--bad);color:#fff}.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:13px}
.prev{display:flex;gap:12px;margin-bottom:12px}.prev img{width:150px;max-width:38%;aspect-ratio:16/9;object-fit:cover;max-height:220px;border-radius:10px;background:var(--in)}
.prev h3{margin:0 0 4px;font-size:16px;line-height:1.35}.mut{color:var(--mut);font-size:13px}
.seg{display:flex;background:var(--in);border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;border:0;background:none;padding:9px;cursor:pointer;font-weight:600}.seg button.on{background:var(--acc);color:#04152e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
label.chk{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.job{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.job:first-child{border-top:0}
.job img{width:96px;height:54px;object-fit:cover;border-radius:8px;background:var(--in);flex:none}
.job .m{flex:1;min-width:0}.job .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:var(--in);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}
.st{font-size:12px;font-weight:700;padding:1px 8px;border-radius:20px;background:var(--in)}
.st.done{color:var(--ok)}.st.error{color:var(--bad)}.st.downloading,.st.processing{color:var(--acc)}.st.queued,.st.canceled{color:var(--mut)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hint{color:var(--warn);font-size:12.5px;margin-top:4px}.errt{color:var(--bad);font-size:12px;word-break:break-word;max-height:3.2em;overflow:hidden}
.empty{text-align:center;color:var(--mut);padding:26px 0}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0b1f4b;color:#fff;border:1px solid #00c8ff;padding:10px 16px;border-radius:12px;z-index:50;max-width:90vw;font-size:14px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(560px,94vw);padding:16px;max-height:90vh}
dialog::backdrop{background:#000a}dialog h2{margin:0 0 10px;font-size:18px}dialog .f{margin:10px 0}dialog .f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.pl{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:8px 0;font-size:13px}.pl label{display:flex;gap:6px;padding:3px 0}
.hide{display:none!important}
@media(max-width:520px){.prev{flex-direction:column}.prev img{width:100%;max-width:none}.job img{width:72px;height:42px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <img src="/static/icons/logo.svg" alt="H-DO"><h1>H-DO</h1>
  <button class="ib" id="bLang" title="Language">EN</button>
  <button class="ib" id="bTheme" title="Theme">🌓</button>
  <button class="ib" id="bSet" title="⚙">⚙️</button>
</header>

<section class="card">
  <textarea id="url" rows="2" placeholder="" spellcheck="false"></textarea>
  <div class="row" style="margin-top:8px">
    <button class="btn sec fit" id="bPaste"></button>
    <button class="btn" id="bInfo"></button>
    <button class="btn sec" id="bQuick"></button>
  </div>
</section>

<section class="card hide" id="preview">
  <div class="prev"><img id="pImg" alt=""><div><h3 id="pTitle"></h3><div class="mut" id="pMeta"></div></div></div>
  <div class="seg" id="mode"><button data-m="video" class="on"></button><button data-m="audio"></button></div>
  <div class="grid">
    <label id="gQ"><span class="mut" data-t="quality"></span><select id="quality"></select></label>
    <label id="gC"><span class="mut" data-t="container"></span><select id="container"><option>mp4</option><option>mkv</option><option>webm</option></select></label>
    <label id="gA" class="hide"><span class="mut" data-t="aformat"></span><select id="aformat"><option>mp3</option><option>m4a</option><option>opus</option><option>flac</option><option>wav</option></select></label>
  </div>
  <div class="row" style="gap:14px">
    <label class="chk fit"><input type="checkbox" id="cSubs"><span data-t="subs"></span></label>
    <label class="chk fit"><input type="checkbox" id="cEmbed" checked><span data-t="embed"></span></label>
    <label class="chk fit" id="lSB"><input type="checkbox" id="cSB"><span data-t="sb"></span></label>
  </div>
  <div id="plBox" class="hide">
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="cPl" checked><span id="plLbl"></span></label>
    <div class="pl" id="plList"></div>
  </div>
  <div class="row" style="margin-top:12px"><button class="btn" id="bGo"></button></div>
</section>

<section class="card">
  <div class="row" style="margin-bottom:6px"><b data-t="queue"></b><button class="btn sec sm fit" id="bClear"></button></div>
  <div id="jobs"></div>
</section>
<div class="mut" style="text-align:center;font-size:12px;padding:6px" id="foot"></div>
</div>

<dialog id="dSet">
  <h2 data-t="settings"></h2>
  <div class="f"><span data-t="dir"></span><input type="text" id="sDir" dir="ltr"></div>
  <div class="row"><div class="f"><span data-t="conc"></span><input type="number" id="sConc" min="1" max="6"></div>
  <div class="f"><span data-t="rate"></span><input type="text" id="sRate" dir="ltr" placeholder="2M"></div></div>
  <div class="row"><div class="f"><span data-t="proxy"></span><input type="text" id="sProxy" dir="ltr" placeholder="socks5://127.0.0.1:1080"></div>
  <div class="f"><span data-t="sublangs"></span><input type="text" id="sLangs" dir="ltr"></div></div>
  <div class="row"><div class="f"><span data-t="quality"></span><select id="sQ"><option value="best">best</option><option>2160</option><option>1440</option><option>1080</option><option>720</option><option>480</option><option>360</option></select></div>
  <div class="f"><span data-t="container"></span><select id="sC"><option>mp4</option><option>mkv</option><option>webm</option></select></div>
  <div class="f"><span data-t="aformat"></span><select id="sA"><option>mp3</option><option>m4a</option><option>opus</option><option>flac</option><option>wav</option></select></div></div>
  <div class="row" style="gap:14px"><label class="chk fit"><input type="checkbox" id="sEmbed"><span data-t="embed"></span></label><label class="chk fit"><input type="checkbox" id="sSB"><span data-t="sb"></span></label></div>
  <div class="f"><span data-t="cookies"></span>
    <div class="row"><input type="file" id="fCk" accept=".txt" class="fit"><button class="btn sec sm fit" id="bCkDel" data-t="remove"></button></div>
    <div class="mut" id="ckInfo"></div></div>
  <div class="f"><button class="btn sec" id="bUpd"></button> <span class="mut" id="verInfo"></span></div>
  <div class="row" style="margin-top:12px"><button class="btn" id="bSave" data-t="save"></button><button class="btn sec" id="bClose" data-t="close"></button></div>
</dialog>

<dialog id="dLogin"><h2>🔒 H-DO</h2><div class="f"><input type="password" id="lPass" autocomplete="current-password"></div><button class="btn" id="bLogin" data-t="login"></button></dialog>

<script>
const I18N={
ar:{ph:"الصق رابط فيديو أو أكثر (يوتيوب، فيسبوك، تيك توك، إنستغرام...) كل رابط في سطر",paste:"📋 لصق",info:"🔍 عرض الخيارات",quick:"⚡ تحميل سريع",video:"🎬 فيديو",audio:"🎵 صوت فقط",quality:"الجودة",container:"الصيغة",aformat:"صيغة الصوت",subs:"الترجمة",embed:"دمج الغلاف والبيانات",sb:"تخطي الإعلانات (SponsorBlock)",go:"⬇️ بدء التحميل",queue:"قائمة التحميل",clear:"مسح المنتهية",empty:"لا توجد تحميلات بعد",cancel:"إلغاء",retry:"إعادة",save:"حفظ",del:"حذف",delf:"حذف مع الملف",settings:"الإعدادات",dir:"مجلد التحميل",conc:"عدد التحميلات المتزامنة",rate:"حد السرعة (مثال 2M)",proxy:"بروكسي",sublangs:"لغات الترجمة",cookies:"ملف الكوكيز (للفيديوهات الخاصة في فيسبوك/يوتيوب)",remove:"حذف",close:"إغلاق",login:"دخول",upd:"تحديث yt-dlp",
st:{queued:"في الانتظار",downloading:"جارٍ التحميل",processing:"معالجة",done:"اكتمل",error:"فشل",canceled:"أُلغي"},
hint:{cookies_needed:"هذا الفيديو يتطلب تسجيل دخول: ارفع ملف cookies.txt من الإعدادات.",ffmpeg_missing:"ffmpeg غير مثبت.",unsupported:"الرابط غير مدعوم.",network:"مشكلة في الاتصال، حاول مجدداً."},
nof:"ffmpeg غير مثبت: الدمج وتحويل الصوت والغلاف معطلة",plAll:n=>`تحميل القائمة كاملة (${n} عنصر)`,added:n=>`أُضيف ${n} إلى القائمة`,dup:"هذا الرابط محمّل أو في القائمة مسبقاً. إعادة التحميل؟",saved:"تم الحفظ",updated:"تم التحديث — أعد تشغيل H-DO لتفعيل الإصدار الجديد",bad:"رابط غير صالح",ckok:"✔ ملف الكوكيز مرفوع",ckno:"لا يوجد ملف كوكيز",confirmDel:"حذف الملف من الجهاز أيضاً؟",uploader:"القناة"},
en:{ph:"Paste one or more video links (YouTube, Facebook, TikTok, Instagram…), one per line",paste:"📋 Paste",info:"🔍 Options",quick:"⚡ Quick download",video:"🎬 Video",audio:"🎵 Audio only",quality:"Quality",container:"Container",aformat:"Audio format",subs:"Subtitles",embed:"Embed thumbnail & metadata",sb:"Skip sponsors (SponsorBlock)",go:"⬇️ Start download",queue:"Download queue",clear:"Clear finished",empty:"No downloads yet",cancel:"Cancel",retry:"Retry",save:"Save",del:"Delete",delf:"Delete + file",settings:"Settings",dir:"Download folder",conc:"Concurrent downloads",rate:"Rate limit (e.g. 2M)",proxy:"Proxy",sublangs:"Subtitle languages",cookies:"Cookies file (private Facebook/YouTube videos)",remove:"Remove",close:"Close",login:"Login",upd:"Update yt-dlp",
st:{queued:"Queued",downloading:"Downloading",processing:"Processing",done:"Done",error:"Failed",canceled:"Canceled"},
hint:{cookies_needed:"This video needs a login: upload a cookies.txt in Settings.",ffmpeg_missing:"ffmpeg is not installed.",unsupported:"Unsupported URL.",network:"Network problem, try again."},
nof:"ffmpeg not installed: merging, audio conversion and cover embedding are disabled",plAll:n=>`Download whole playlist (${n} items)`,added:n=>`${n} added to queue`,dup:"Already downloaded or queued. Download again?",saved:"Saved",updated:"Updated — restart H-DO to use the new version",bad:"Invalid URL",ckok:"✔ Cookies file uploaded",ckno:"No cookies file",confirmDel:"Also delete the file from disk?",uploader:"Channel"}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let lang=localStorage.hdoLang||((navigator.language||"").startsWith("ar")?"ar":"en"),T=I18N[lang],S={},INFO=null,MODE="video",LAST="",timer;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fs=b=>!b?"":b>=1e9?(b/1e9).toFixed(2)+" GB":b>=1e6?(b/1e6).toFixed(1)+" MB":(b/1e3).toFixed(0)+" KB";
const fd=s=>{if(!s)return"";s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const fe=s=>s==null?"":s>=3600?Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m":s>=60?Math.floor(s/60)+"m "+Math.round(s%60)+"s":Math.round(s)+"s";
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
async function api(p,o={}){const r=await fetch(p,o);if(r.status===401&&p!=="/api/login"){$("#dLogin").showModal();throw {auth:1}}
  let j={};try{j=await r.json()}catch(e){}j._status=r.status;return j}
const post=(p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});

function applyLang(){T=I18N[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("#bLang").textContent=lang==="ar"?"EN":"ع";
  $$("[data-t]").forEach(e=>e.textContent=T[e.dataset.t]);$("#url").placeholder=T.ph;$("#bPaste").textContent=T.paste;$("#bInfo").textContent=T.info;$("#bQuick").textContent=T.quick;
  $("#bGo").textContent=T.go;$("#bClear").textContent=T.clear;$("#bUpd").textContent=T.upd;
  $$("#mode button").forEach(b=>b.textContent=T[b.dataset.m]);renderJobs(window._jobs||[])}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.hdoTheme=t}
setTheme(localStorage.hdoTheme||"dark");
$("#bTheme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("#bLang").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.hdoLang=lang;applyLang()};

function urls(){return $("#url").value.split(/\s+/).map(s=>s.trim()).filter(s=>/^https?:\/\//i.test(s))}
$("#bPaste").onclick=async()=>{try{$("#url").value=await navigator.clipboard.readText();onUrl()}catch(e){$("#url").focus()}};
$("#url").addEventListener("input",()=>{if(urls().length===1&&urls()[0]!==LAST&&/^https?:\/\/\S+$/.test($("#url").value.trim()))clearTimeout(timer)});
function setMode(m){MODE=m;$$("#mode button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("#gQ").classList.toggle("hide",m!=="video");$("#gC").classList.toggle("hide",m!=="video");$("#gA").classList.toggle("hide",m!=="audio");}
$$("#mode button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));

async function onUrl(){const u=urls();if(u.length===1)getInfo();}
async function getInfo(){const u=urls();if(!u.length)return toast(T.bad);if(u.length>1)return quick();
  $("#bInfo").disabled=true;$("#bInfo").textContent="…";
  try{const r=await api("/api/info?playlist=1&url="+encodeURIComponent(u[0]));
    if(r.error){toast((r.hint&&T.hint[r.hint])||r.error.slice(-160));return}
    INFO=r;INFO.src=u[0];LAST=u[0];showPreview(r)}catch(e){}
  finally{$("#bInfo").disabled=false;$("#bInfo").textContent=T.info}}
function showPreview(r){$("#preview").classList.remove("hide");$("#pImg").onerror=function(){this.onerror=null;this.src="/static/icons/logo.svg"};$("#pImg").src=r.thumbnail||"/static/icons/logo.svg";$("#pTitle").textContent=r.title||"";
  const q=$("#quality");q.innerHTML='<option value="best">best</option>'+(r.heights||[]).map(h=>`<option value="${h}">${h}p</option>`).join("");
  const dq=S.settings?.quality||"1080";if([...q.options].some(o=>o.value===dq))q.value=dq;else if(r.heights&&r.heights.length)q.value=String(r.heights.find(h=>h<=+dq)||r.heights[r.heights.length-1]);
  $("#container").value=S.settings?.container||"mp4";$("#aformat").value=S.settings?.audio_format||"mp3";
  $("#cEmbed").checked=!!S.settings?.embed;$("#cSB").checked=!!S.settings?.sponsorblock;
  const yt=/youtu/.test(INFO.src);$("#lSB").classList.toggle("hide",!yt);
  const meta=[r.uploader?T.uploader+": "+r.uploader:"",r.duration?fd(r.duration):"",r.extractor||""].filter(Boolean).join(" • ");
  if(r.type==="playlist"){$("#pMeta").textContent=[r.uploader,r.count+" ▶"].filter(Boolean).join(" • ");$("#plBox").classList.remove("hide");
    $("#plLbl").textContent=T.plAll(r.count);$("#plList").innerHTML=r.entries.map((e,i)=>`<label><input type="checkbox" checked data-i="${i}"><span>${esc(e.title)}</span></label>`).join("");}
  else{$("#pMeta").textContent=meta;$("#plBox").classList.add("hide")}
  setMode(MODE);$("#preview").scrollIntoView({behavior:"smooth",block:"nearest"})}
function body(){return{mode:MODE,quality:$("#quality").value,container:$("#container").value,audio_format:$("#aformat").value,subtitles:$("#cSubs").checked,embed:$("#cEmbed").checked,sponsorblock:$("#cSB").checked}}
async function submit(b){let r=await post("/api/downloads",b);
  if(r._status===409){if(!confirm(T.dup))return;r=await post("/api/downloads",{...b,force:true})}
  if(r.error)return toast(r.error==="invalid_url"?T.bad:r.error);toast(T.added(r.count));refresh();return r}
$("#bGo").onclick=async()=>{if(!INFO)return;const b=body();
  if(INFO.type==="playlist"){const sel=$$("#plList input:checked").map(x=>+x.dataset.i);
    if(!$("#cPl").checked)b.urls=[INFO.entries[0].url],b.meta=INFO.entries[0];
    else{b.url=INFO.src;b.playlist=true;b.items=sel}}
  else{b.url=INFO.src;b.meta={title:INFO.title,thumbnail:INFO.thumbnail,uploader:INFO.uploader,duration:INFO.duration}}
  await submit(b);$("#preview").classList.add("hide");$("#url").value="";INFO=null};
async function quick(){const u=urls();if(!u.length)return toast(T.bad);const s=S.settings||{};
  await submit({urls:u,mode:MODE,quality:s.quality,container:s.container,audio_format:s.audio_format,embed:s.embed,sponsorblock:s.sponsorblock});$("#url").value=""}
$("#bInfo").onclick=getInfo;$("#bQuick").onclick=quick;

function renderJobs(jobs){window._jobs=jobs;const box=$("#jobs");
  if(!jobs.length){box.innerHTML=`<div class="empty">${T.empty}</div>`;return}
  box.innerHTML=jobs.map(j=>{const act=["queued","downloading","processing"].includes(j.status);
    const prog=act?`<div class="bar"><i style="width:${j.percent||0}%"></i></div><div class="mut">${j.status==="queued"?"":(j.percent||0).toFixed(1)+"%"} ${j.speed?" • "+fs(j.speed)+"/s":""} ${j.eta?" • "+fe(j.eta):""} ${j.total?" • "+fs(j.total):""}</div>`:"";
    const info=j.status==="done"?`<div class="mut">${fs(j.size)} • ${esc(j.opts.mode==="audio"?j.opts.audio_format:j.opts.quality==="best"?"best":j.opts.quality+"p")}</div>`:"";
    const err=j.status==="error"?`<div class="errt" dir="ltr">${esc(j.error)}</div>${j.hint?`<div class="hint">${esc(T.hint[j.hint]||"")}</div>`:""}`:"";
    const b=[];if(act)b.push(`<button class="btn sec sm" onclick="act('${j.id}','cancel')">${T.cancel}</button>`);
    if(j.status==="done")b.push(`<a class="btn sm" style="text-decoration:none" href="/api/files/${j.id}" download>${T.save}</a>`);
    if(j.status==="error"||j.status==="canceled")b.push(`<button class="btn sec sm" onclick="act('${j.id}','retry')">${T.retry}</button>`);
    if(!act)b.push(`<button class="btn sec sm" onclick="rm('${j.id}',${j.status==="done"})">${T.del}</button>`);
    return`<div class="job"><img src="${esc(j.thumbnail||'/static/icons/logo.svg')}" alt="" onerror="this.onerror=null;this.src='/static/icons/logo.svg'"><div class="m"><div class="t" title="${esc(j.title)}">${esc(j.title)}</div>
      <span class="st ${j.status}">${T.st[j.status]}</span>${prog}${info}${err}<div class="acts">${b.join("")}</div></div></div>`}).join("")}
async function act(id,a){await post(`/api/downloads/${id}/${a}`);refresh()}
async function rm(id,done){const f=done&&confirm(T.confirmDel);await api(`/api/downloads/${id}${f?"?file=1":""}`,{method:"DELETE"});refresh()}
$("#bClear").onclick=async()=>{await post("/api/downloads/clear");refresh()};
async function refresh(){try{const r=await api("/api/downloads");if(r.jobs)renderJobs(r.jobs)}catch(e){}}
setInterval(()=>{if(!document.hidden)refresh()},1000);

async function loadStatus(){try{S=await api("/api/status");if(S.settings){$("#foot").textContent=`H-DO ${S.version} • yt-dlp ${S.ytdlp}${S.ffmpeg?"":" • ⚠ "+T.nof}`}}catch(e){}}
$("#bSet").onclick=async()=>{await loadStatus();const s=S.settings;$("#sDir").value=s.download_dir;$("#sConc").value=s.max_concurrent;$("#sRate").value=s.rate_limit;$("#sProxy").value=s.proxy;
  $("#sLangs").value=s.sub_langs;$("#sQ").value=s.quality;$("#sC").value=s.container;$("#sA").value=s.audio_format;$("#sEmbed").checked=s.embed;$("#sSB").checked=s.sponsorblock;
  $("#ckInfo").textContent=S.cookies?T.ckok:T.ckno;$("#verInfo").textContent="yt-dlp "+S.ytdlp;$("#dSet").showModal()};
$("#bClose").onclick=()=>$("#dSet").close();
$("#bSave").onclick=async()=>{const r=await post("/api/settings",{download_dir:$("#sDir").value.trim(),max_concurrent:+$("#sConc").value||2,rate_limit:$("#sRate").value.trim(),proxy:$("#sProxy").value.trim(),
  sub_langs:$("#sLangs").value.trim(),quality:$("#sQ").value,container:$("#sC").value,audio_format:$("#sA").value,embed:$("#sEmbed").checked,sponsorblock:$("#sSB").checked});
  if(r.error)return toast(r.error);toast(T.saved);$("#dSet").close();loadStatus()};
$("#fCk").onchange=async e=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append("file",f);const r=await api("/api/cookies",{method:"POST",body:fd});
  if(r.error)toast(r.error);else{toast(T.saved);$("#ckInfo").textContent=T.ckok}};
$("#bCkDel").onclick=async()=>{await post("/api/cookies?delete=1");$("#ckInfo").textContent=T.ckno};
$("#bUpd").onclick=async()=>{$("#bUpd").disabled=true;const r=await post("/api/update-ytdlp");$("#bUpd").disabled=false;
  if(r.error)toast(r.error.slice(-140));else{toast(T.updated);$("#verInfo").textContent=`${r.before} → ${r.after}`}};
$("#bLogin").onclick=async()=>{const r=await post("/api/login",{password:$("#lPass").value});if(r._status===200){$("#dLogin").close();start()}else toast("✖")};
$("#lPass").addEventListener("keydown",e=>{if(e.key==="Enter")$("#bLogin").click()});

async function start(){await loadStatus();refresh();
  const p=new URLSearchParams(location.search);const sh=(p.get("url")||"")+" "+(p.get("text")||"");const m=sh.match(/https?:\/\/\S+/);
  if(m){$("#url").value=m[0];history.replaceState(null,"","/");getInfo()}}
applyLang();setMode("video");start();
</script>
</body>
</html>
